<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Sign Up</h1>
    Please fill in this form to create an account.
    <br>
    <label for="email">Email</label>
    <input name="email" type="email" placeholder="Enter Email"> <br>
    <label for="psw">Password</label>
    <input name="psw" type="password" placeholder="Enter Password"> <br>
    <label for="rpsw">Repeat Password</label>
    <input name="rpsw" type="password" placeholder="Repeat Password"> <br>
    <input type="checkbox" name="rem" value="Remember">
    <label for="rem">Remember Me</label> <br>
    <label for="mobile">Mobile No.</label>
    <input name="mobile" type="tel" placeholder="Phone"> <br>
    <label for="dob">Date of Birth</label>
    <input name="dob" type="date" placeholder="DOB"> <br>
    <label for="male">Male</label>
    <input id="male" type="radio" name="gen">
    <label for="female">Female</label>
    <input id="female" type="radio" name="gen">
</body>
</html>
