<!DOCTYPE html>
<html>
<head>
<style>
img {
  position: fixed;
  top: 0;
  z-index: -1;
}
*{
  padding: 0;
  margin: 0;
  color: black;
}
</style>
</head>
<body>

<h1>This is a heading</h1>
<img src="TREE.jpeg">
<p>Because the image has a z-index of -1, it will be placed behind the text.</p>

</body>
</html>
