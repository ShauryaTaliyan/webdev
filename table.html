<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>

<body>
    <h1>Learning Git</h1>
    <table align="center" cellspacing="5" width="80%" cellpadding="10" border="2">
        <caption>
            <strong>Quaterly Sales Report (INR)</strong>
        </caption>
        <thead>
            <tr bgcolor="gray" align="center">
                <th>Category</th>
                <th>Product</th>
                <th>Q1 Sales</th>
                <th>Q2 Sales</th>
            </tr>
        </thead>
        <tfoot>
            <tr>
                <th align="left" colspan="2" bgcolor="lightgrey">
                    Total Gross
                </th>
                <th align="right" bgcolor="lightgrey">
                    ₹12,75,615
                </th>
                <th align="right" bgcolor="lightgrey">
                    ₹14,45,697
                </th>
            </tr>
        </tfoot>
        <tbody>
            <tr align="left">
                <td valign="top" rowspan="2" bgcolor="#fffffff">Electronics</td>
                <td>Smartphones</td>
                <td align="right">₹4,72,450</td>
                <td align="right">₹5,85,838</td>
            </tr>
            <tr align="left">
                <td>Laptops</td>
                <td align="right">₹8,03,165</td>
                <td align="right">₹8,59,859</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
